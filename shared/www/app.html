function familyLinkedChildren(){
  if(session.role!=='family')return state.children;
  const userName=String(session.user?.name||'').trim().toLowerCase();
  const profile=session.profile||{};
  const explicit=[];
  [profile.child_name,profile.childName].forEach(v=>{if(v)explicit.push(String(v))});
  [profile.child_names,profile.children].forEach(v=>{if(Array.isArray(v))v.forEach(x=>explicit.push(typeof x==='string'?x:(x?.name||'')))});
  const explicitSet=new Set(explicit.filter(Boolean).map(x=>String(x).trim().toLowerCase()));
  let linked=state.children.filter(c=>explicitSet.has(c.name.toLowerCase())||c.guardian?.toLowerCase()===userName||(Array.isArray(c.pickup)&&c.pickup.some(x=>String(x).toLowerCase()===userName)));
  // Demo family account maps to Avery Brooks → Ethan Brooks. Keep a safe fallback for incomplete live profiles.
  if(!linked.length&&session.demo)linked=state.children.filter(c=>c.name==='Ethan Brooks');

}
function getNotifications(){
  const items=[];
  if(session.role==='family'){
    const linked=familyLinkedChildren();
    const childNames=new Set(linked.map(c=>c.name));
    const rooms=new Set(linked.map(c=>c.room));
    const userName=String(session.user?.name||'');
    const familyMessage=m=>{
      const hay=[m.from,m.to,m.subject,m.body].filter(Boolean).join(' ').toLowerCase();
      if(String(m.to||'').toLowerCase()===userName.toLowerCase()||String(m.from||'').toLowerCase()===userName.toLowerCase())return true;
      for(const n of childNames)if(hay.includes(n.toLowerCase()))return true;
      for(const r of rooms)if(String(m.to||'').toLowerCase()===String(r).toLowerCase())return true;
      return false;
    };
    state.messages.filter(m=>m.unread&&familyMessage(m)).forEach(m=>items.push({kind:'message',id:m.id,view:'messages',title:m.subject,detail:`New message from ${m.from}`,tone:'message'}));
    state.compliance.filter(x=>childNames.has(x.owner)&&/due soon|expired/i.test(x.status)).forEach(x=>items.push({view:'documents',title:x.item,detail:`${x.owner} · ${x.status} · ${x.due}`,tone:'warning'}));
    state.invoices.filter(x=>childNames.has(x.child)&&/due|overdue/i.test(x.status)&&!/paid/i.test(x.status)).forEach(x=>items.push({view:'billing',title:`Invoice · ${x.child}`,detail:`$${Number(x.amount).toLocaleString()} · ${x.status} · due ${x.due}`,tone:/overdue/i.test(x.status)?'danger':'warning'}));
    state.incidents.filter(x=>childNames.has(x.child)).forEach(x=>items.push({view:'care',title:`Incident · ${x.child}`,detail:`${x.type} · ${x.status}`,tone:'incident'}));
    return items;
  }
  state.messages.filter(m=>m.unread).forEach(m=>items.push({kind:'message',id:m.id,view:'messages',title:m.subject,detail:`New message from ${m.from}`,tone:'message'}));
  state.compliance.filter(x=>/due soon|expired/i.test(x.status)).forEach(x=>items.push({view:'compliance',title:x.item,detail:`${x.owner} · ${x.status} · ${x.due}`,tone:'warning'}));
  state.invoices.filter(x=>/overdue/i.test(x.status)).forEach(x=>items.push({view:'billing',title:`Overdue invoice · ${x.family}`,detail:`$${Number(x.amount).toLocaleString()} due ${x.due}`,tone:'danger'}));

  return items;
}

function getViewMode(key,def){try{return localStorage.getItem('kidkeep_view_'+key)||def}catch(e){return def}}function setViewMode(key,mode){if(!['grid','table'].includes(mode))return;try{localStorage.setItem('kidkeep_view_'+key,mode)}catch(e){}renderView()}function viewSwitch(key,current){return `<div class="viewToggle" role="group" aria-label="View options"><button type="button" class="${current==='grid'?'active':''}" data-view-key="${key}" data-view-mode="grid" aria-pressed="${current==='grid'}">${icons.rooms}<span>Grid</span></button><button type="button" class="${current==='table'?'active':''}" data-view-key="${key}" data-view-mode="table" aria-pressed="${current==='table'}">${icons.reports}<span>Table</span></button></div>`}
function viewAttendance(){
const tab=(()=>{try{return localStorage.getItem('kidkeep_attendance_tab')||'check'}catch(e){return 'check'}})();
const mode=getViewMode('attendance','table');
const qrIcon='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9"><path d="M4 4h6v6H4zM14 4h6v6h-6zM4 14h6v6H4z"/><path d="M14 14h2v2h-2zM18 14h2v2h-2zM14 18h2v2h-2zM18 18h2v2h-2z"/></svg>';
const noteIcon='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9"><path d="M5 4h14v13H9l-4 4V4Z"/><path d="M9 9h6M9 13h4"/></svg>';
const moreIcon='<svg viewBox="0 0 24 24" fill="currentColor"><circle cx="5" cy="12" r="1.7"/><circle cx="12" cy="12" r="1.7"/><circle cx="19" cy="12" r="1.7"/></svg>';
const searchIcon='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>';
const gridIcon='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9"><rect x="4" y="4" width="6" height="6"/><rect x="14" y="4" width="6" height="6"/><rect x="4" y="14" width="6" height="6"/><rect x="14" y="14" width="6" height="6"/></svg>';
const listIcon='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9"><path d="M8 6h12M8 12h12M8 18h12"/><circle cx="4" cy="6" r="1" fill="currentColor"/><circle cx="4" cy="12" r="1" fill="currentColor"/><circle cx="4" cy="18" r="1" fill="currentColor"/></svg>';
const scanIcon=qrIcon;
const plusIcon='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 5v14M5 12h14"/></svg>';
const peopleIcon='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9"><circle cx="9" cy="8" r="3"/><path d="M3 20c0-4 2-7 6-7s6 3 6 7M16 6a3 3 0 0 1 0 6M17 13c3 0 5 2 5 6"/></svg>';
const leadForRoom=room=>state.rooms.find(r=>r.name===room)?.lead||'';
const latestFor=c=>state.attendance.find(a=>a.child===c.name);
const avatar=(c,i)=>c.photo?`<span class="attAvatar"><img src="${c.photo}" alt="${c.name}"></span>`:`<span class="attAvatar attAvatar${i%5}">${initials(c.name)}</span>`;
const statusBadge=c=>`<button type="button" class="attStatus ${c.status==='in'?'checked':'absent'}" data-toggle-child="${c.id}" title="Click to ${c.status==='in'?'check out':'check in'}">${c.status==='in'?'Checked In':'Absent'}</button>`;
const rows=state.children.map((c,i)=>{const last=latestFor(c),lead=leadForRoom(c.room),note=state.attendanceNotes[c.id]||'';const out=c.status==='in'?'—':(last&&/out/i.test(last.action)?last.time:'—');return `<div class="attRow" data-attendance-item data-search="${(c.name+' '+c.room+' '+c.guardian+' '+c.allergies).toLowerCase()}" data-room="${c.room.toLowerCase()}" data-status="${c.status==='in'?'in':'out'}"><div class="attPerson">${avatar(c,i)}<div><b>${c.name}</b><small>${c.age}</small></div></div><div class="attRoom"><b>${c.room}</b><small>${lead?lead.replace(/^/, 'Ms. ').replace('Ms. Nia','Nia').replace('Ms. Amir','Mr. Amir'):''}</small></div><div>${statusBadge(c)}</div><div class="attTime">${last&&c.status==='in'?`<b>${last.time}</b><small>by ${last.by}</small>`:'—'}</div><div class="attTime">${out==='—'?'—':`<b>${out}</b>`}</div><div class="attActions"><button class="attIconBtn" data-door-qr="${c.id}" aria-label="QR code for ${c.name}" title="QR code">${qrIcon}</button><button class="attIconBtn ${note?'hasNote':''}" data-child-note="${c.id}" aria-label="Attendance note for ${c.name}" title="Attendance note">${noteIcon}${note?'<span class="noteDot"></span>':''}</button><button class="attIconBtn" data-edit-child="${c.id}" aria-label="More actions for ${c.name}" title="More actions">${moreIcon}</button></div></div>`}).join('');
const gridCards=state.children.map((c,i)=>{const last=latestFor(c),lead=leadForRoom(c.room),note=state.attendanceNotes[c.id]||'',out=c.status==='in'?'—':(last&&/out/i.test(last.action)?last.time:'—');return `<article class="attGridCard" data-attendance-item data-search="${(c.name+' '+c.room+' '+c.guardian+' '+c.allergies).toLowerCase()}" data-room="${c.room.toLowerCase()}" data-status="${c.status==='in'?'in':'out'}"><div class="attGridTop">${avatar(c,i)}<div class="attGridIdentity"><b>${c.name}</b><small>${c.age} · ${c.room}</small></div>${statusBadge(c)}</div><div class="attGridDetails"><div><span>Classroom</span><b>${c.room}</b><small>${lead?lead.replace(/^/, 'Ms. ').replace('Ms. Nia','Nia').replace('Ms. Amir','Mr. Amir'):''}</small></div><div><span>Check In</span>${last&&c.status==='in'?`<b>${last.time}</b><small>by ${last.by}</small>`:'<b>—</b>'}</div><div><span>Check Out</span>${out==='—'?'<b>—</b>':`<b>${out}</b>`}</div></div><div class="attGridActions"><button class="attIconBtn" data-door-qr="${c.id}" aria-label="QR code for ${c.name}" title="QR code">${qrIcon}</button><button class="attIconBtn ${note?'hasNote':''}" data-child-note="${c.id}" aria-label="Attendance note for ${c.name}" title="Attendance note">${noteIcon}${note?'<span class="noteDot"></span>':''}</button><button class="attIconBtn" data-edit-child="${c.id}" aria-label="More actions for ${c.name}" title="More actions">${moreIcon}</button></div></article>`}).join('');
const header=`<div class="attPageHead"><div><h2>Attendance</h2><p>Track check-in/out, view attendance, and add notes.</p></div><div class="attTopActions"><button class="attPrimary" data-action="bulk-checkin">${peopleIcon}<span>Bulk Check-In</span></button><button class="attSecondary" data-action="scanner">${scanIcon}<span>Scanner</span></button>${session.role==='admin'?`<button class="attSecondary" data-action="add-child">${plusIcon}<span>Add Child</span></button>`:''}</div></div><div class="attTabs"><button class="${tab==='check'?'active':''}" data-attendance-tab="check">Check-In/Out</button><button class="${tab==='history'?'active':''}" data-attendance-tab="history">Attendance History</button><button class="${tab==='summary'?'active':''}" data-attendance-tab="summary">Daily Summary</button></div>`;
if(tab==='history')return `${header}<div class="attPanel"><div class="attHistoryHead"><div><h3>Attendance History</h3><p>Recent arrivals and departures recorded for your program.</p></div><button class="attSecondary" data-action="export">Export CSV</button></div><div class="attHistoryTable"><div class="attHistoryHeader"><span>Time</span><span>Child</span><span>Event</span><span>Recorded By</span></div>${state.attendance.map(a=>`<div class="attHistoryItem"><span>${a.time}</span><b>${a.child}</b><span>${a.action}</span><span>${a.by}</span></div>`).join('')}</div></div>`;
if(tab==='summary'){const present=state.children.filter(c=>c.status==='in').length;const absent=state.children.length-present;return `${header}<div class="attSummaryGrid"><div class="attSummaryCard"><small>Checked In</small><strong>${present}</strong><span>children currently on site</span></div><div class="attSummaryCard"><small>Absent / Checked Out</small><strong>${absent}</strong><span>children currently off site</span></div><div class="attSummaryCard"><small>Total Enrolled</small><strong>${state.children.length}</strong><span>active child records</span></div></div><div class="attPanel"><h3>Classroom Attendance</h3><div class="attClassSummary">${state.rooms.map(r=>{const kids=state.children.filter(c=>c.room===r.name),on=kids.filter(c=>c.status==='in').length,pct=kids.length?Math.round(on/kids.length*100):0;return `<div class="attClassLine"><div><b>${r.name}</b><small>${on} of ${kids.length} on site</small></div><div class="attProgress"><span style="width:${pct}%"></span></div><strong>${pct}%</strong></div>`}).join('')}</div></div>`}
const rosterMarkup=mode==='grid'?`<div class="attCardGrid">${gridCards}</div>`:`<div class="attRoster"><div class="attRosterHeader"><span>Child</span><span>Classroom</span><span>Status</span><span>Check In</span><span>Check Out</span><span>Actions</span></div>${rows}</div>`;return `${header}<div class="attFilterbar"><label class="attSearch">${searchIcon}<input id="attendanceSearch" placeholder="Search children..." autocomplete="off"></label><select id="attendanceRoomFilter"><option value="">All Classrooms</option>${state.rooms.map(r=>`<option value="${r.name.toLowerCase()}">${r.name}</option>`).join('')}</select><select id="attendanceStatusFilter"><option value="">All Statuses</option><option value="in">Checked In</option><option value="out">Absent / Checked Out</option></select><div class="attViewToggle"><button type="button" class="${mode==='grid'?'active':''}" data-view-key="attendance" data-view-mode="grid" aria-label="Grid view" aria-pressed="${mode==='grid'}">${gridIcon}</button><button type="button" class="${mode==='table'?'active':''}" data-view-key="attendance" data-view-mode="table" aria-label="Table view" aria-pressed="${mode==='table'}">${listIcon}</button></div></div>${rosterMarkup}<div class="attFooter"><span id="attendanceRange">Showing 0 of ${state.children.length} children</span><div class="attPagination" id="attendancePagination" aria-label="Attendance pages"></div></div>`}

function viewChildren(){const list=session.role==='family'?state.children.filter(c=>c.name==='Ethan Brooks'):state.children;const mode=getViewMode('children',session.role==='family'?'grid':'table');const canEdit=session.role==='admin';const rows=list.map(c=>`<tr data-child-item data-search="${(c.name+' '+c.age+' '+c.room+' '+c.guardian+' '+c.allergies+' '+c.pickup.join(' ')).toLowerCase()}"><td><div class="childTableIdentity">${childPhotoMarkup(c)}<b>${c.name}</b></div></td><td>${c.age}</td><td>${c.room}</td><td>${c.guardian}<br><small>${c.phone}</small></td><td>${c.allergies==='None'?status('None'):status(c.allergies)}</td><td>${c.pickup.join(', ')}</td>${canEdit?`<td><div class="recordActions"><button class="btn small" data-edit-child="${c.id}">Edit</button><button class="btn small danger" data-delete-record="children|${c.id}|${c.name}">Delete</button></div></td>`:''}</tr>`).join('');const cards=list.map(c=>`<article class="childGridCard" data-child-item data-search="${(c.name+' '+c.age+' '+c.room+' '+c.guardian+' '+c.allergies+' '+c.pickup.join(' ')).toLowerCase()}"><div class="childGridTop">${childPhotoMarkup(c)}<div><h3>${c.name}</h3><p>${c.room} · ${c.age}</p></div><div style="margin-left:auto">${status(c.status==='in'?'On site':'Off-site')}</div></div><div class="childGridMeta"><div><small>Guardian</small><b>${c.guardian}</b><span>${c.phone}</span></div><div><small>Allergies</small><span>${c.allergies==='None'?'None':c.allergies}</span></div></div><div class="childGridPickup"><small>Authorized Pickup</small><span>${c.pickup.length?c.pickup.join(', '):'No authorized persons on file'}</span></div>${canEdit?`<div class="childGridActions"><button class="btn small" data-edit-child="${c.id}">Edit Child</button><button class="btn small danger" data-delete-record="children|${c.id}|${c.name}">Delete</button></div>`:''}</article>`).join('');const famChild=list[0];return `<div class="pageHead"><div><h2>${session.role==='family'?'My Children':'Child Records'}</h2><p>${list.length} ${list.length===1?'profile':'active child records'}</p></div><div class="actions">${session.role==='admin'?'<button class="btn primary" data-action="add-child">Add Child</button>':''}</div></div>${session.role==='family'&&famChild?`<div class="familyHero"><div class="childHero">${childPhotoMarkup(famChild,'bigAvatar')}<div><h2 style="margin:0 0 4px">${famChild.name}</h2><p style="margin:0">${famChild.room} · ${famChild.age} · ${famChild.status==='in'?'On site today':'Off-site'}</p></div></div><button class="btn" data-go="messages">Message Classroom</button></div>`:''}<div class="attendanceToolbar" style="margin-top:${session.role==='family'?'14':'0'}px"><input class="searchbar" id="childSearch" placeholder="Search Children" autocomplete="off"><div class="toolbarGroup">${viewSwitch('children',mode)}</div></div><div id="childrenTableView" class="${mode==='table'?'':'hiddenView'}"><div class="card"><div class="tableWrap"><table class="table" id="childTable"><thead><tr><th>Child</th><th>Age</th><th>Classroom</th><th>Guardian</th><th>Allergies</th><th>Authorized Pickup</th>${canEdit?'<th>Actions</th>':''}</tr></thead><tbody>${rows}</tbody></table></div></div></div><div id="childrenGridView" class="${mode==='grid'?'':'hiddenView'}"><div class="childrenGrid">${cards}</div></div>`}
function viewClassrooms(){return `<div class="pageHead"><div><h2>Classrooms</h2><p>Enrollment capacity, staffing ratios and room assignments</p></div><button class="btn primary" data-action="add-room">Add Classroom</button></div><div class="roomGrid">${state.rooms.map(r=>`<div class="room"><div class="roomTitleRow"><h3>${r.name}</h3>${session.role==='admin'?`<div class="recordActions"><button class="btn small" data-edit-room="${r.id}">Edit</button><button class="btn small danger" data-delete-room="${r.id}">Delete</button></div>`:''}</div><div class="roomMeta">${r.age} · Lead: ${r.lead}</div><div class="capacity"><span style="width:${Math.min(100,Math.round(r.enrolled/r.capacity*100))}%"></span></div><div class="roomFooter"><span>${r.enrolled}/${r.capacity} enrolled</span><span>Ratio ${r.ratio}</span></div></div>`).join('')}</div><div class="card" style="margin-top:18px"><div class="cardHead"><h3>Room Assignment</h3></div><div class="tableWrap"><table class="table"><thead><tr><th>Child</th><th>Classroom</th><th>Age</th><th>Status</th></tr></thead><tbody>${state.children.map(c=>`<tr><td><b>${c.name}</b></td><td>${c.room}</td><td>${c.age}</td><td>${status(c.status==='in'?'On site':'Not on site')}</td></tr>`).join('')}</tbody></table></div></div>`}
function viewClassroom(){const room='Toddlers', kids=state.children.filter(c=>c.room===room);return `<div class="pageHead"><div><h2>${room}</h2><p>${kids.length} children · Lead teacher Maya Thompson</p></div><div class="actions"><button class="btn" data-action="new-care">Record Care</button><button class="btn primary" data-go="attendance">Attendance</button></div></div><div class="grid two"><div class="card"><div class="cardHead"><h3>Classroom Roster</h3></div><div class="cardBody list">${kids.map(childRow).join('')}</div></div><div class="card"><div class="cardHead"><h3>Today’s Care</h3></div><div class="cardBody"><div class="feed">${state.care.filter(x=>kids.some(k=>k.name===x.child)).map(x=>`<div class="feedItem"><div class="time">${x.time}</div><b>${x.child} · ${x.type}</b><p>${x.detail}</p></div>`).join('')||'<div class="empty"><b>No entries yet</b>Record daily care as the day progresses.</div>'}</div></div></div></div>`}
function viewFamilies(){return `<div class="pageHead"><div><h2>Families & Enrollment</h2><p>Family relationships, applications and enrollment progress</p></div><button class="btn primary" data-action="add-application">New Application</button></div><div class="grid metrics"><div class="metric"><span class="metricLabel">Active Families</span><div class="metricValue">${new Set(state.children.map(c=>c.guardian)).size}</div><div class="metricMeta">linked to enrolled children</div></div><div class="metric"><span class="metricLabel">Applications</span><div class="metricValue">${state.applications.length}</div><div class="metricMeta">in enrollment pipeline</div></div><div class="metric"><span class="metricLabel">Documents Needed</span><div class="metricValue">1</div><div class="metricMeta">family follow-up required</div></div><div class="metric"><span class="metricLabel">Upcoming Starts</span><div class="metricValue">2</div><div class="metricMeta">next 45 days</div></div></div><div class="card"><div class="cardHead"><h3>Enrollment Applications</h3></div><div class="tableWrap"><table class="table"><thead><tr><th>Child</th><th>Guardian</th><th>Age</th><th>Requested Start</th><th>Status</th><th>Action</th></tr></thead><tbody>${state.applications.map(a=>`<tr><td><b>${a.child}</b></td><td>${a.guardian}</td><td>${a.age}</td><td>${a.start}</td><td>${status(a.status)}</td><td><button class="btn small" data-edit-application="${a.id}">Edit</button><button class="btn small danger" data-delete-record="applications|${a.id}|${a.child}">Delete</button></td></tr>`).join('')}</tbody></table></div></div>`}
function viewStaff(){const mode=getViewMode('staff','table');const roleOptions=staffRoleOptions();const avatar=s=>s.photo?`<div class="staffGridAvatar hasPhoto"><img src="${s.photo}" alt="${s.name} photo"></div>`:`<div class="staffGridAvatar">${initials(s.name)}</div>`;const rows=state.staff.map(s=>`<tr data-staff-item data-search="${(s.name+' '+s.role+' '+s.room+' '+s.status+' '+s.credential).toLowerCase()}"><td><div class="staffTableIdentity">${avatar(s)}<b>${s.name}</b></div></td><td>${s.role}</td><td>${s.room}</td><td>${status(s.status)}</td><td>${s.credential}</td><td><div class="staffActions"><button class="btn small" data-edit-staff="${s.id}">Edit</button><button class="btn small danger" data-delete-record="staff|${s.id}|${s.name}">Delete</button></div></td></tr>`).join('');const cards=state.staff.map(s=>`<article class="staffGridCard" data-staff-item data-search="${(s.name+' '+s.role+' '+s.room+' '+s.status+' '+s.credential).toLowerCase()}"><div class="staffGridTop">${avatar(s)}<div><h3>${s.name}</h3><p>${s.role}</p></div><div style="margin-left:auto">${status(s.status)}</div></div><div class="staffGridMeta"><div><small>Classroom</small><b>${s.room}</b></div><div><small>Role</small><span>${s.role}</span></div></div><div class="staffGridCredential"><small>Credential Status</small><span>${s.credential}</span></div><div class="staffGridActions"><button class="btn small" data-edit-staff="${s.id}">Edit Staff</button><button class="btn small danger" data-delete-record="staff|${s.id}|${s.name}">Delete</button></div></article>`).join('');return `<div class="pageHead"><div><h2>Staff Directory</h2><p>${state.staff.length} team members · ${PROGRAM_MODE==='daycare'?'Daycare staffing':'Center staffing'}</p><div class="roleLegend">${roleOptions.map(r=>`<span class="rolePill">${r}</span>`).join('')}</div></div><div class="actions">${session.role==='admin'?'<button class="btn" data-action="manage-roles">Role Titles</button>':''}<button class="btn primary" data-action="add-staff">Add Staff</button></div></div><div class="attendanceToolbar"><input class="searchbar" id="staffSearch" placeholder="Search Staff" autocomplete="off"><select class="searchbar" id="staffRoleFilter" style="min-width:190px"><option value="">All Roles</option>${roleOptions.map(r=>`<option>${r}</option>`).join('')}</select><div class="toolbarGroup">${viewSwitch('staff',mode)}</div></div><div id="staffTableView" class="${mode==='table'?'':'hiddenView'}"><div class="card"><div class="tableWrap"><table class="table"><thead><tr><th>Staff Member</th><th>Role</th><th>Classroom</th><th>Today</th><th>Credential Status</th><th>Action</th></tr></thead><tbody>${rows}</tbody></table></div></div></div><div id="staffGridView" class="${mode==='grid'?'':'hiddenView'}"><div class="staffGrid">${cards}</div></div>`}

d'?`<button class="btn small" data-paid="${i.id}">Mark Paid</button>`:''}</div></td>`:''}</tr>`).join('')}</tbody></table></div></div>`}

/div></div></div></div></div>`}
function familyHome(){const care=state.care.filter(x=>x.child==='Ethan Brooks');return `<div class="pageHead"><div><h2>Welcome, ${session.user.name.split(' ')[0]}</h2><p>${new Date().toLocaleDateString([],{weekday:'long',month:'long',day:'numeric'})} · Little Harbor Learning Center</p></div><button class="btn primary" data-go="messages">Message Classroom</button></div><div class="familyHero"><div class="childHero"><div class="bigAvatar">EB</div><div><h2 style="margin:0 0 4px">Ethan Brooks</h2><p style="margin:0">Infants · Checked in at 8:21 AM</p></div></div>${status('On site')}</div><div class="careGrid" style="margin-top:14px"><div class="careStat"><small>Last meal</small><b>10:30 AM</b></div><div class="careStat"><small>Nap</small><b>12:28–2:04</b></div><div class="careStat"><small>Diapers</small><b>3 today</b></div><div class="careStat"><small>Pickup</small><b>Avery / Jordan</b></div></div><div class="grid two" style="margin-top:14px"><div class="card"><div class="cardHead"><h3>Today’s Updates</h3><button class="btn small" data-go="care">Full Daily Report</button></div><div class="cardBody"><div class="feed">${care.map(x=>`<div class="feedItem"><div class="time">${x.time}</div><b>${x.type}</b><p>${x.detail}</p></div>`).join('')}</div></div></div><div class="card"><div class="cardHead"><h3>Program Announcements</h3></div><div class="cardBody"><div class="feed">${state.announcements.map(a=>`<div class="feedItem"><div class="time">${a.date}</div><b>${a.title}</b><p>${a.body}</p>${session.role==='admin'?`<button class="btn small" data-edit-announcement="${a.id}">Edit</button><button class="btn small danger" data-delete-record="announcements|${a.id}|${a.title}">Delete</button>`:''}</div>`).join('')}</div></div></div></div>`}
let childCameraStream=null,childCameraFacing='environment',childPhotoDraft='';
function stopChildCamera(){if(childCameraStream){childCameraStream.getTracks().forEach(t=>t.stop());childCameraStream=null}const v=document.getElementById('childCameraVideo');if(v)v.srcObject=null}
function openModal(title,body,foot=''){stopChildCamera();$('#modalTitle').textContent=title;$('#modalBody').innerHTML=body;$('#modalFoot').innerHTML=foot;$('#modalBack').classList.add('show');try{bindModal()}catch(err){console.error('KidKeep modal binding error',err);$$('[data-modal-close]').forEach(b=>b.onclick=closeModal)}}function closeModal(){stopChildCamera();childPhotoDraft='';$('#modalBack').classList.remove('show')}function toast(t){const x=$('#toast');x.textContent=t;x.classList.add('show');setTimeout(()=>x.classList.remove('show'),2200)}
function childPhotoMarkup(c,cls='childGridAvatar'){return c&&c.photo?`<div class="${cls} hasPhoto"><img src="${c.photo}" alt="${c.name} photo"></div>`:`<div class="${cls}">${initials(c?.name||'Child')}</div>`}
function childPhotoEditor(photo='',label='Child Photo'){childPhotoDraft=photo||'';return `<div class="childPhotoPanel"><div class="childPhotoLayout"><div class="childPhotoPreview" id="childPhotoPreview">${photo?`<img src="${photo}" alt="${label} preview">`:'No photo yet'}</div><div><div style="font-size:14px;font-weight:900;color:#172b43;margin-bottom:8px">${label}</div><div class="childPhotoButtons"><button type="button" class="btn" id="startChildCamera">Use Camera</button><button type="button" class="btn" id="uploadChildPhoto">Upload Photo</button>${photo?'<button type="button" class="btn danger" id="removeChildPhoto">Remove</button>':''}</div><input id="childPhotoFile" type="file" accept="image/*" capture="environment" hidden><div class="childPhotoHelp">Take a current photo or upload one from this device. KidKeep crops and compresses the image for the record.</div></div><div class="cameraStage" id="childCameraStage"><div class="cameraViewport"><video id="childCameraVideo" autoplay playsinline muted></video><div class="childPhotoCaptureFlash" id="childPhotoFlash"></div></div><div class="cameraControls"><button type="button" class="btn" id="switchChildCamera">Switch Camera</button><button type="button" class="btn primary" id="captureChildPhoto">Capture Photo</button><button type="button" class="btn" id="closeChildCamera">Close Camera</button></div><div class="cameraStatus" id="childCameraStatus">Camera preview</div></div></div></div>`}
function setChildPhotoPreview(data){childPhotoDraft=data||'';const p=document.getElementById('childPhotoPreview');if(p)p.innerHTML=data?`<img src="${data}" alt="Child photo preview">`:'No photo yet'}
function normalizeChildPhoto(source,w,h){const size=Math.min(w,h),sx=(w-size)/2,sy=(h-size)/2,canvas=document.createElement('canvas');canvas.width=480;canvas.height=480;const ctx=canvas.getContext('2d');ctx.drawImage(source,sx,sy,size,size,0,0,480,480);return canvas.toDataURL('image/jpeg',.82)}
async function startChildCamera(){if(!navigator.mediaDevices?.getUserMedia){toast('Camera is not supported in this browser');return}stopChildCamera();const stage=document.getElementById('childCameraStage'),statusEl=document.getElementById('childCameraStatus'),video=document.getElementById('childCameraVideo');if(stage)stage.classList.add('show');if(statusEl)statusEl.textContent='Requesting camera permission…';try{childCameraStream=await navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:childCameraFacing},width:{ideal:1280},height:{ideal:720}},audio:false});if(video){video.srcObject=childCameraStream;await video.play()}if(statusEl)statusEl.textContent=childCameraFacing==='environment'?'Back camera ready':'Front camera ready'}catch(e){if(statusEl)statusEl.textContent='Camera unavailable. You can upload a photo instead.';toast('Could not open camera')}}
function bindChildPhotoEditor(){const by=id=>document.getElementById(id),start=by('startChildCamera'),upload=by('uploadChildPhoto'),file=by('childPhotoFile'),remove=by('removeChildPhoto'),capture=by('captureChildPhoto'),switchBtn=by('switchChildCamera'),close=by('closeChildCamera');if(start)start.onclick=startChildCamera;if(upload&&file)upload.onclick=()=>file.click();if(file)file.onchange=()=>{const f=file.files&&file.files[0];if(!f)return;const img=new Image();img.onload=()=>{setChildPhotoPreview(normalizeChildPhoto(img,img.naturalWidth,img.naturalHeight));URL.revokeObjectURL(img.src);toast('Photo ready to save')};img.src=URL.createObjectURL(f)};if(remove)remove.onclick=()=>{setChildPhotoPreview('');toast('Photo removed from draft')};if(capture)capture.onclick=()=>{const video=by('childCameraVideo');if(!video||!video.videoWidth){toast('Camera is still starting');return}setChildPhotoPreview(normalizeChildPhoto(video,video.videoWidth,video.videoHeight));const flash=by('childPhotoFlash');if(flash){flash.classList.remove('flash');void flash.offsetWidth;flash.classList.add('flash')}toast('Photo captured')};if(switchBtn)switchBtn.onclick=async()=>{childCameraFacing=childCameraFacing==='environment'?'user':'environment';await startChildCamera()};if(close)close.onclick=()=>{stopChildCamera();by('childCameraStage')?.classList.remove('show')}}

function openAttendanceFlow(childId){const c=state.children.find(x=>x.id===childId);if(!c)return;const isIn=c.status==='in';const people=(c.pickup||[]).filter(Boolean);const options=people.length?people.map(n=>`<option>${n}</option>`).join(''):`<option value="">(no authorized persons on file)</option>`;const actionLabel=isIn?'Check-Out':'Check-In';const personLabel=isIn?'Person picking up (must be authorized)':'Person dropping off (must be authorized)';openModal(`${isIn?'Check Out':'Check In'} — ${c.name}`,`<div class="checkFlow"><section class="checkSection"><div class="checkSectionTitle">Daily Health Check</div><div class="field"><label>Overall Wellness</label><select id="attendanceWellness"><option>Well</option><option>Minor symptoms noted</option><option>Needs staff review</option></select></div></section><div class="field"><label>${personLabel}</label><select id="attendancePerson">${options}</select></div>${people.length?'':`<div class="authWarning">No authorized person is on file for ${c.name}. Add an authorized pickup/contact to the child record before completing ${actionLabel.toLowerCase()}.</div>`}<div class="field"><label>Staff Member</label><input id="attendanceStaff" value="${session.user.name}" readonly></div><div class="field"><label>Parent / Guardian Signature <span style="font-weight:600;color:#98a2b3">(optional)</span></label><div class="signatureWrap" id="signatureWrap"><canvas id="signaturePad" class="signaturePad"></canvas><div class="signatureHint">Sign here with mouse or finger</div><button type="button" class="signatureClear" id="clearSignature">Clear Signature</button></div></div></div>`,`<button class="btn" data-modal-close>Cancel</button><button class="btn primary" id="attendanceConfirm" ${people.length?'':'disabled'}>Confirm ${actionLabel}</button>`);setTimeout(()=>setupAttendanceFlow(c,isIn),0)}
function setupAttendanceFlow(c,isIn){const canvas=$('#signaturePad'),wrap=$('#signatureWrap'),clear=$('#clearSignature'),confirm=$('#attendanceConfirm');if(canvas){const ctx=canvas.getContext('2d');let drawing=false,last=null;const resize=()=>{const r=canvas.getBoundingClientRect(),dpr=window.devicePixelRatio||1;canvas.width=Math.max(1,Math.round(r.width*dpr));canvas.height=Math.max(1,Math.round(r.height*dpr));ctx.setTransform(dpr,0,0,dpr,0,0);ctx.lineWidth=2;ctx.lineCap='round';ctx.lineJoin='round';ctx.strokeStyle='#172b43'};resize();const point=e=>{const r=canvas.getBoundingClientRect(),t=e.touches?e.touches[0]:e;return{x:t.clientX-r.left,y:t.clientY-r.top}};const start=e=>{e.preventDefault();drawing=true;last=point(e);wrap.classList.add('signed')};const move=e=>{if(!drawing)return;e.preventDefault();const p=point(e);ctx.beginPath();ctx.moveTo(last.x,last.y);ctx.lineTo(p.x,p.y);ctx.stroke();last=p};const end=()=>{drawing=false;last=null};canvas.addEventListener('pointerdown',start);canvas.addEventListener('pointermove',move);window.addEventListener('pointerup',end,{once:false});canvas.addEventListener('touchstart',start,{passive:false});canvas.addEventListener('touchmove',move,{passive:false});canvas.addEventListener('touchend',end);clear.onclick=()=>{ctx.clearRect(0,0,canvas.width,canvas.height);wrap.classList.remove('signed')}}if(confirm)confirm.onclick=()=>{const person=$('#attendancePerson')?.value;if(!person){toast('Authorized person required');return}c.status=isIn?'out':'in';state.attendance.unshift({id:'a'+Date.now(),child:c.name,action:c.status==='in'?'Checked in':'Checked out',time:timeNow(),by:session.user.name,authorizedPerson:person,wellness:$('#attendanceWellness')?.value||'Well',temperature:$('#attendanceTemp')?.value||'',healthNotes:$('#attendanceHealthNotes')?.value||'',screening:[...document.querySelectorAll('.screeningChecks input:checked')].map(x=>x.value)});save();closeModal();toast(c.name+' '+(c.status==='in'?'checked in':'checked out'));renderView()}}
function bind(){
  const attendancePageSize=5;
  let attendancePage=Math.max(1,Number(localStorage.getItem('kidkeep_attendance_page')||1));
  const applyAttendanceFilter=(reset=false)=>{
    const q=($('#attendanceSearch')?.value||'').trim().toLowerCase(),room=($('#attendanceRoomFilter')?.value||''),st=($('#attendanceStatusFilter')?.value||''),all=$$('[data-attendance-item]');
    const matches=all.filter(item=>(!q||(item.dataset.search||'').includes(q))&&(!room||item.dataset.room===room)&&(!st||item.dataset.status===st));
    if(reset)attendancePage=1;const pages=Math.max(1,Math.ceil(matches.length/attendancePageSize));attendancePage=Math.min(attendancePage,pages);
    try{localStorage.setItem('kidkeep_attendance_page',String(attendancePage))}catch(e){}
    all.forEach(item=>item.style.display='none');const start=(attendancePage-1)*attendancePageSize,end=Math.min(start+attendancePageSize,matches.length);matches.slice(start,end).forEach(item=>item.style.display='');
    const range=$('#attendanceRange');if(range)range.textContent=matches.length?`Showing ${start+1} to ${end} of ${matches.length} children`:'No children match these filters';
    const pager=$('#attendancePagination');if(pager){if(pages<=1){pager.innerHTML=''}else{let html=`<button type="button" data-att-page="${attendancePage-1}" ${attendancePage===1?'disabled':''} aria-label="Previous page">‹</button>`;for(let p=1;p<=pages;p++)html+=`<button type="button" data-att-page="${p}" class="${p===attendancePage?'active':''}" aria-current="${p===attendancePage?'page':'false'}">${p}</button>`;html+=`<button type="button" data-att-page="${attendancePage+1}" ${attendancePage===pages?'disabled':''} aria-label="Next page">›</button>`;pager.innerHTML=html}}
  };
  window.__kidkeepApplyAttendanceFilter=(reset=false,page=null)=>{if(page!==null)attendancePage=Math.max(1,Number(page)||1);applyAttendanceFilter(reset)};
  const as=$('#attendanceSearch');if(as)as.oninput=()=>applyAttendanceFilter(true);const ar=$('#attendanceRoomFilter');if(ar)ar.onchange=()=>applyAttendanceFilter(true);const ast=$('#attendanceStatusFilter');if(ast)ast.onchange=()=>applyAttendanceFilter(true);if(as||ar||ast)applyAttendanceFilter(false);
  const cs=$('#childSearch');if(cs)cs.oninput=()=>{const q=cs.value.trim().toLowerCase();$$('[data-child-item]').forEach(item=>item.style.display=!q||item.dataset.search.includes(q)?'':'none')};
  const applyStaffFilter=()=>{const q=($('#staffSearch')?.value||'').trim().toLowerCase(),role=($('#staffRoleFilter')?.value||'').trim().toLowerCase();$$('[data-staff-item]').forEach(item=>{const text=item.dataset.search||'';item.style.display=((!q||text.includes(q))&&(!role||text.includes(role)))?'':'none'})};const ss=$('#staffSearch');if(ss)ss.oninput=applyStaffFilter;const rf=$('#staffRoleFilter');if(rf)rf.onchange=applyStaffFilter;
}

function filterTable(sel,q){q=q.toLowerCase();$$(sel+' tbody tr').forEach(r=>r.style.display=r.textContent.toLowerCase().includes(q)?'':'none')}
function fields(obj){return Object.entries(obj).map(([id,v])=>{let [label,type,options]=v;const key=(id+' '+label).toLowerCase();if(!type&&/(date|due|start|birth|dob)/.test(key))type='date';if(!type&&/phone/.test(key))type='tel';let control;if(type==='select')control=`<select id="${id}">${options.map(o=>`<option>${o}</option>`).join('')}</select>`;else if(type==='textarea')control=`<textarea id="${id}"></textarea>`;else{const isPhone=type==='tel'||/phone/.test(key),isAge=/age/.test(key),isDate=type==='date';const ph=isPhone?'(###) ###-####':isAge?'e.g. 3y 8m':isDate?'mm/dd/yyyy':'';const attrs=[`id="${id}"`,`type="${isPhone||isAge?'text':(type||'text')}"`,ph?`placeholder="${ph}"`:'',isPhone?'inputmode="tel" data-format="phone"':'',isAge?'inputmode="text" data-format="age"':'',isDate?'data-format="date"':''].filter(Boolean).join(' ');control=`<input ${attrs}>`}return `<div class="field ${type==='textarea'?'span2':''}"><label>${label}</label>${control}</div>`}).join('')}
function formatPhoneValue(v){const d=String(v||'').replace(/\D/g,'').slice(0,10);if(!d)return '';if(d.length<4)return `(${d}`;if(d.length<7)return `(${d.slice(0,3)}) ${d.slice(3)}`;return `(${d.slice(0,3)}) ${d.slice(3,6)}-${d.slice(6)}`}
function normalizeAgeValue(v){let x=String(v||'').trim().toLowerCase().replace(/years?|yrs?/g,'y').replace(/months?|mos?/g,'m').replace(/\s+/g,' ');const nums=x.match(/\d+/g)||[];if(!nums.length)return x;if(/y/.test(x)&&/m/.test(x))return `${nums[0]}y ${nums[1]||0}m`;if(/y/.test(x))return `${nums[0]}y`;if(/m/.test(x))return `${nums[0]}m`;return nums.length>1?`${nums[0]}y ${nums[1]}m`:`${nums[0]}y`}
function ageFromDob(v){if(!v)return '';const dob=new Date(v+'T12:00:00');if(Number.isNaN(dob.getTime()))return '';const now=new Date();let months=(now.getFullYear()-dob.getFullYear())*12+(now.getMonth()-dob.getMonth());if(now.getDate()<dob.getDate())months--;if(months<0)return '';const y=Math.floor(months/12),m=months%12;return y?`${y}y ${m}m`:`${m}m`}
function bindStandardFormats(root=document){

  root.querySelectorAll('[data-format="phone"],input[type="tel"]').forEach(el=>{el.type='text';el.inputMode='tel';el.autocomplete='tel';el.placeholder='(###) ###-####';el.value=formatPhoneValue(el.value);const sync=()=>{el.value=formatPhoneValue(el.value);el.dataset.formattedValue=el.value};el.oninput=sync;el.onblur=sync;el.onchange=sync});
  root.querySelectorAll('[data-format="age"],input[id*="Age" i],input[name*="age" i]').forEach(el=>{el.placeholder='e.g. 3y 8m';el.addEventListener('blur',()=>{el.value=normalizeAgeValue(el.value)})});
  root.querySelectorAll('input[type="date"],input[data-format="dob"]').forEach(el=>{if(el.dataset.format==='dob')el.type='date';el.setAttribute('aria-label',el.getAttribute('aria-label')||'Choose date from calendar');el.style.colorScheme='light'});
}
